<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연말정산 정밀 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f8fafc; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 24px; border: 1px solid #f1f5f9; }
    .num-input { text-align: right; font-weight: 500; font-size: 1.1rem; }
    .num-input::placeholder { font-weight: 400; color: #cbd5e1; }
  </style>
</head>
<body>
  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-calculator"></i></div>
        <div>
          <h1 class="text-xl font-bold text-gray-800">연말정산 정밀 시뮬레이터</h1>
          <p class="text-xs text-gray-500">2026 국세청 표준 누진 계산식 & 상세 풀이</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition" onclick="location.reload()"><i class="fa-solid fa-rotate-right mr-1"></i> 입력값 초기화</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 flex flex-col lg:flex-row gap-8">
    <!-- 왼쪽 입력 폼 -->
    <div class="flex-1 max-w-3xl">
      
      <!-- 섹션 1: 급여 -->
      <div class="card">
        <div class="flex items-center gap-3 mb-6">
          <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">1</span>
          <div>
            <h2 class="text-lg font-bold text-gray-800">급여 및 비과세 소득 분리</h2>
            <p class="text-sm text-gray-500">비과세를 뺀 '진짜 총급여액'을 기준으로 세금을 계산합니다.</p>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">계약연봉 (연간 총 수령액 = 기본급 + 상여 + 각종 수당)</label>
          <div class="relative">
            <input type="text" id="salary" class="num-input w-full border border-gray-300 rounded-lg p-3 pr-8 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline
